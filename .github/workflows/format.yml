name: Format

on:
  push:
    branches:
      - master
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: cachix/install-nix-action@v31
      - name: install dependencies
        run: nix develop -c bundle install
      - name: show formatter version
        run: nix develop -c clang-format --version
      - name: format
        run: nix develop -c bundle exec rake format
      - uses: EndBug/add-and-commit@v11
        with:
          author_name: Tim Morgan
          author_email: tim@timmorgan.org
          message: "Format code (automated)"
